<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpendWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>SpendWise</h1>
    <p id="tagline">Track your budget. Spend wisely. Auto deploy works!</p>
  </header>

  <main class="layout">
    <section class="panel entry" aria-labelledby="entry-title">
      <h2 id="entry-title">Your month</h2>

      <label for="name">Your name</label>
      <input id="name" type="text" placeholder="Guest" autocomplete="name">

      <label for="budget">Monthly budget ($)</label>
      <input id="budget" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal">

      <h3>Expenses</h3>
      <ul id="expense-list" class="expenses"></ul>

      <form id="expense-form" class="add-row">
        <input id="exp-label" type="text" placeholder="Rent, food, transport…" aria-label="Expense name" required>
        <input id="exp-amount" type="number" min="0" step="0.01" placeholder="0.00" aria-label="Expense amount" inputmode="decimal" required>
        <button type="submit" class="btn">Add expense</button>
      </form>
    </section>

    <section class="panel summary" aria-labelledby="sum-title" aria-live="polite">
      <h2 id="sum-title">Your budget summary</h2>
      <p class="who" id="who">Guest</p>

      <p class="remaining-label">Remaining</p>
      <p class="remaining" id="remaining">$0.00</p>

      <div class="meter" role="img" aria-label="Share of budget spent">
        <div class="meter-fill" id="meter-fill"></div>
      </div>
      <p class="meter-note" id="meter-note">Enter your budget to begin.</p>

      <dl class="figures">
        <div><dt>Monthly budget</dt><dd id="out-budget">$0.00</dd></div>
        <div><dt>Total expenses</dt><dd id="out-expenses">$0.00</dd></div>
        <div><dt>Number of expenses</dt><dd id="out-count">0</dd></div>
      </dl>

      <button id="console-btn" class="btn btn-light" type="button">Print full breakdown to console</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
